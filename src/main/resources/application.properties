spring.application.name=account-book

# 数据库连接配置
spring.datasource.url=jdbc:mysql://localhost:3306/account_book?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.map-underscore-to-camel-case=true

# 加载本地私密配置（AI 密钥等），该文件已在 .gitignore 中，不会提交到仓库
spring.config.import=optional:file:./ai-local.properties

# 大模型配置（OpenAI 兼容协议）
ai.base-url=https://open.bigmodel.cn/api/paas/v4/chat/completions
ai.model=glm-4-flash
ai.api-key=

# Token 配置：生产环境请用环境变量 APP_TOKEN_SECRET 覆盖，不要使用默认值
app.token.secret=${APP_TOKEN_SECRET:jzbook-dev-secret-2026-change-in-prod}
app.token.expire-hours=72
